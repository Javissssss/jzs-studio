<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#FAF9F5;--fg:#141413;--muted:#87867F;--border:#E3DACC;--accent:#C96442;--accent-d:#B04A3F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
#figure{width:1080px;background:linear-gradient(160deg,#FAF9F5 0%,#F3EFE6 100%);
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
  padding:64px 72px;color:var(--fg)}
.hd{margin-bottom:48px}
.hd .kick{font-size:20px;letter-spacing:.25em;color:var(--accent);font-weight:600;margin-bottom:14px}
.hd h1{font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;font-size:46px;font-weight:700;line-height:1.3}
.hd .sub{font-size:22px;color:var(--muted);margin-top:12px}
.line{position:relative;padding-left:44px}
.line::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--border)}
.ev{position:relative;padding-bottom:40px}
.ev:last-child{padding-bottom:0}
.ev::before{content:"";position:absolute;left:-44px;top:8px;width:20px;height:20px;
  border-radius:50%;background:var(--bg);border:4px solid var(--accent)}
.ev .date{font-family:ui-monospace,Consolas,monospace;font-size:21px;color:var(--accent-d);
  font-weight:700;margin-bottom:8px}
.ev .text{font-size:25px;line-height:1.65}
.foot{margin-top:48px;padding-top:24px;border-top:1px solid var(--border);
  font-size:17px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div id="figure">
  <div class="hd">
    <div class="kick">TIMELINE</div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="line" id="events"></div>
  <div class="foot">__BRAND__ · 时间线</div>
</div>
<script>
const D = /*__DATA__*/;
document.getElementById('title').textContent = D.title || '';
document.getElementById('subtitle').textContent = D.subtitle || '';
const box = document.getElementById('events');
(D.events||[]).forEach(e=>{
  const el = document.createElement('div'); el.className='ev';
  el.innerHTML = '<div class="date"></div><div class="text"></div>';
  el.querySelector('.date').textContent = e.date||'';
  el.querySelector('.text').textContent = e.text||'';
  box.appendChild(el);
});
</script>
</body>
</html>
