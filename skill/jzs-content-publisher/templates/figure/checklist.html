<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#FAF9F5;--fg:#141413;--muted:#87867F;--border:#E3DACC;--accent:#C96442;--accent-d:#B04A3F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
#figure{width:1080px;background:linear-gradient(160deg,#FAF9F5 0%,#F3EFE6 100%);
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
  padding:64px 72px;color:var(--fg)}
.hd{margin-bottom:48px}
.hd .kick{font-size:20px;letter-spacing:.25em;color:var(--accent);font-weight:600;margin-bottom:14px}
.hd h1{font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;font-size:46px;font-weight:700;line-height:1.3}
.hd .sub{font-size:22px;color:var(--muted);margin-top:12px}
.items{display:flex;flex-direction:column;gap:20px}
.item{background:#fff;border:1px solid var(--border);border-radius:16px;
  padding:26px 30px;display:flex;gap:24px;align-items:flex-start}
.box{flex:0 0 40px;height:40px;border-radius:10px;border:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.box svg{width:22px;height:22px;stroke:var(--accent);stroke-width:3.5;fill:none}
.txt .t{font-size:27px;font-weight:700;line-height:1.5}
.txt .n{font-size:21px;color:var(--muted);margin-top:6px;line-height:1.6}
.foot{margin-top:48px;padding-top:24px;border-top:1px solid var(--border);
  font-size:17px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div id="figure">
  <div class="hd">
    <div class="kick">CHECKLIST</div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="items" id="items"></div>
  <div class="foot">__BRAND__ · 清单图</div>
</div>
<script>
const D = /*__DATA__*/;
document.getElementById('title').textContent = D.title || '';
document.getElementById('subtitle').textContent = D.subtitle || '';
const box = document.getElementById('items');
const tick = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>';
(D.items||[]).forEach(it=>{
  const el = document.createElement('div'); el.className='item';
  el.innerHTML = `<div class="box">${tick}</div><div class="txt"><div class="t"></div><div class="n"></div></div>`;
  el.querySelector('.t').textContent = it.text||'';
  el.querySelector('.n').textContent = it.note||'';
  box.appendChild(el);
});
</script>
</body>
</html>
