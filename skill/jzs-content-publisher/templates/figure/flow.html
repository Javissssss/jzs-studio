<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#FAF9F5;--fg:#141413;--muted:#87867F;--border:#E3DACC;--accent:#C96442;--accent-d:#B04A3F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
#figure{width:1080px;background:linear-gradient(160deg,#FAF9F5 0%,#F3EFE6 100%);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  padding:64px 72px;color:var(--fg)}
.hd{margin-bottom:48px}
.hd .kick{font-size:20px;letter-spacing:.25em;color:var(--accent);font-weight:600;margin-bottom:14px}
.hd h1{font-family:"Noto Serif SC",serif;font-size:46px;font-weight:700;line-height:1.3}
.hd .sub{font-size:22px;color:var(--muted);margin-top:12px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:32px;align-items:flex-start;position:relative;padding-bottom:40px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:31px;top:64px;bottom:0;
  width:2px;background:var(--border)}
.num{flex:0 0 64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,Consolas,monospace}
.body{padding-top:6px}
.body .label{font-size:30px;font-weight:700;margin-bottom:8px}
.body .desc{font-size:23px;color:var(--muted);line-height:1.7}
.foot{margin-top:48px;padding-top:24px;border-top:1px solid var(--border);
  font-size:17px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div id="figure">
  <div class="hd">
    <div class="kick" id="kick">FRAMEWORK</div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="steps" id="steps"></div>
  <div class="foot">巨人之上 · 框架图</div>
</div>
<script>
const D = /*__DATA__*/;
document.getElementById('title').textContent = D.title || '';
document.getElementById('subtitle').textContent = D.subtitle || '';
const box = document.getElementById('steps');
(D.steps||[]).forEach((s,i)=>{
  const el = document.createElement('div'); el.className='step';
  el.innerHTML = `<div class="num">${String(i+1).padStart(2,'0')}</div>
    <div class="body"><div class="label"></div><div class="desc"></div></div>`;
  el.querySelector('.label').textContent = s.label||'';
  el.querySelector('.desc').textContent = s.desc||'';
  box.appendChild(el);
});
</script>
</body>
</html>
