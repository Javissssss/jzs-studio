name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app.py core skill/jzs-content-publisher/scripts
      - name: Unit + API tests (offline)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log || {
            # surface the traceback as annotations so it shows on the PR
            grep -E "^(ERROR|FAIL):|Error|File \"" test.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
